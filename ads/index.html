<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>d4cute 후원</title>
  <meta name="description" content="d4cute 헬퍼를 응원하는 방법 - 파트너 추천 링크 모음">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* ── 토큰: d4help 사이트와 같은 어두운 바탕 + 금색. 파트너 색은 카드 상단 띠에만 ── */
    :root {
      --bg: #0d0c11;
      --surface: #16131d;
      --surface-2: #1d1926;
      --line: rgba(234, 179, 8, .30);
      --line-soft: rgba(255, 255, 255, .07);
      --gold: #eab308;
      --gold-ink: #1a1304;
      --text: #e2e8f0;
      --dim: #94a3b8;
      --mute: #64748b;
      --accent: var(--gold);
      --display: "Noto Serif KR", "Malgun Gothic", serif;
      --body: "Noto Sans KR", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, Consolas, "Cascadia Mono", monospace;
    }

    /* 스크롤은 되지만 스크롤바는 숨긴다 - 헬퍼 창 안에서 한 몸처럼 보이게 */
    html { scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font-family: var(--body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

    .page { max-width: 880px; margin: 0 auto; padding: 44px 24px 72px; }

    /* ── 머리: 명제 한 줄 + 고지 ── */
    .head { padding-bottom: 28px; border-bottom: 1px solid var(--line); margin-bottom: 36px; }
    .eyebrow { font-size: 12px; letter-spacing: .22em; color: var(--gold); font-weight: 700; margin: 0 0 14px; }
    .head h1 { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1.25; letter-spacing: -.01em; margin: 0 0 14px; }
    .head p { margin: 0; color: var(--dim); max-width: 60ch; }
    .head .promise { margin-top: 12px; font-size: 13px; color: var(--mute); }

    /* ── 광고 카드 ── */
    .ad {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: 18px;
      padding: 28px 28px 24px;
      margin: 0 0 28px;
      overflow: hidden;
    }
    .ad::before { /* 파트너 색 띠 - 카드가 누구 것인지 */
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--accent);
    }
    .ad-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .badge { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 3px 10px; }
    .cat { font-size: 12px; color: var(--mute); }
    .ad h2 { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.3; letter-spacing: -.01em; margin: 0 0 10px; }
    .ad .lead { margin: 0 0 20px; color: var(--dim); }

    /* 플레이어 하나 + 칩으로 영상 전환 */
    .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--line-soft); }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 22px; }
    .chip {
      font: inherit; font-size: 13px; cursor: pointer; color: var(--dim);
      background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 999px; padding: 6px 12px;
      transition: border-color .15s, color .15s;
    }
    .chip small { color: var(--mute); margin-left: 6px; }
    .chip:hover { color: var(--text); border-color: rgba(255,255,255,.18); }
    .chip[aria-pressed="true"] { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); font-weight: 700; }
    .chip[aria-pressed="true"] small { color: var(--gold-ink); opacity: .75; }

    /* 쓰임새 격자 */
    .points { list-style: none; margin: 0 0 22px; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
    .points li { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 14px 16px; }
    .points b { display: block; font-size: 14px; margin-bottom: 4px; color: var(--text); }
    .points span { font-size: 13.5px; color: var(--dim); line-height: 1.6; }

    /* 요금 표 */
    .facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; padding: 16px 18px; border: 1px dashed var(--line); border-radius: 12px; font-size: 14px; }
    .facts dt { color: var(--dim); }
    .facts dd { margin: 0; font-family: var(--mono); font-size: 13.5px; color: var(--text); }
    .facts-note { font-size: 12.5px; color: var(--mute); margin: 8px 0 22px; }

    /* CTA + 시그니처(아이템 속성 줄처럼 보이는 추천 코드) */
    .cta {
      display: block; text-align: center; text-decoration: none;
      background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 16px;
      border-radius: 12px; padding: 15px 20px; border: 1px solid #d4a206;
      transition: transform .12s, filter .12s;
    }
    .cta:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .affix {
      margin: 12px auto 0; width: fit-content; max-width: 100%;
      font-family: var(--mono); font-size: 12.5px; color: var(--gold);
      border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; background: rgba(234,179,8,.05);
      word-break: break-all; text-align: center;
    }
    .affix code { font: inherit; letter-spacing: .04em; }

    .ad-foot { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line-soft); font-size: 12.5px; color: var(--mute); }
    .ad-foot p { margin: 0 0 6px; }
    .ad-foot a { color: var(--dim); }

    .empty { color: var(--dim); padding: 32px; text-align: center; border: 1px dashed var(--line-soft); border-radius: 14px; }
    .foot { margin-top: 40px; font-size: 13px; color: var(--mute); text-align: center; }
    .foot a { color: var(--dim); }

    @media (max-width: 560px) {
      .page { padding: 28px 16px 56px; }
      .head h1 { font-size: 27px; }
      .ad { padding: 20px 16px 18px; }
      .ad h2 { font-size: 21px; }
      .facts { grid-template-columns: 1fr; gap: 2px; }
      .facts dd { margin-bottom: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chip, .cta { transition: none; }
      .cta:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="head">
      <p class="eyebrow">후원</p>
      <h1>헬퍼는 무료입니다.</h1>
      <p>아래 파트너 추천 링크로 가입하면 제작자에게 소정의 보상이 가고, 그게 다음 업데이트를 만듭니다. 가입자가 더 내는 비용은 없습니다.</p>
      <p class="promise">헬퍼는 이 페이지를 보여 줄 뿐, 자동으로 아무것도 보내지 않습니다. 가입 여부도 헬퍼는 알지 못합니다.</p>
    </header>

    <section id="ads" aria-live="polite">
      <noscript>
        <div class="empty">스크립트가 꺼져 있어 목록을 그릴 수 없습니다.
          <a href="https://starlink.com?referral=RC-DF-5813441-39413-44" target="_blank" rel="noopener">스타링크 추천 링크</a></div>
      </noscript>
    </section>

    <footer class="foot">
      파트너 제안·문의는 텔레그램 <a href="https://t.me/d4cute_helper" target="_blank" rel="noopener">@d4cute_helper</a>
    </footer>
  </main>

  <script src="./ads.js"></script>
  <script>
    (function () {
      var root = document.getElementById("ads");
      var ads = (window.D4CUTE_ADS || []).filter(function (a) { return a && a.active !== false; });

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }
      function embedUrl(id) {
        return "https://www.youtube.com/embed/" + encodeURIComponent(id) + "?rel=0&modestbranding=1";
      }

      if (!ads.length) {
        root.appendChild(el("div", "empty", "아직 등록된 파트너가 없습니다."));
        return;
      }

      ads.forEach(function (ad) {
        var card = el("article", "ad");
        card.id = "ad-" + ad.id;
        if (ad.accent) card.style.setProperty("--accent", ad.accent);

        var head = el("header", "ad-head");
        head.appendChild(el("span", "badge", "파트너 · " + ad.partner));
        if (ad.category) head.appendChild(el("span", "cat", ad.category));
        card.appendChild(head);

        card.appendChild(el("h2", null, ad.title));
        if (ad.lead) card.appendChild(el("p", "lead", ad.lead));

        var videos = ad.videos || [];
        if (videos.length) {
          var player = el("div", "player");
          var frame = document.createElement("iframe");
          frame.src = embedUrl(videos[0].id);
          frame.title = videos[0].label;
          frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
          frame.setAttribute("allowfullscreen", "");
          frame.setAttribute("loading", "lazy");
          frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
          player.appendChild(frame);
          card.appendChild(player);

          if (videos.length > 1) {
            var chips = el("div", "chips");
            chips.setAttribute("role", "group");
            chips.setAttribute("aria-label", "영상 고르기");
            videos.forEach(function (v, i) {
              var chip = el("button", "chip", v.label);
              chip.type = "button";
              chip.setAttribute("aria-pressed", i === 0 ? "true" : "false");
              if (v.meta) chip.appendChild(el("small", null, v.meta));
              chip.addEventListener("click", function () {
                if (chip.getAttribute("aria-pressed") === "true") return;
                chips.querySelectorAll(".chip").forEach(function (c) { c.setAttribute("aria-pressed", "false"); });
                chip.setAttribute("aria-pressed", "true");
                frame.src = embedUrl(v.id);
                frame.title = v.label;
              });
              chips.appendChild(chip);
            });
            card.appendChild(chips);
          }
        }

        if (ad.points && ad.points.length) {
          var ul = el("ul", "points");
          ad.points.forEach(function (pt) {
            var li = el("li");
            li.appendChild(el("b", null, pt.h));
            li.appendChild(el("span", null, pt.p));
            ul.appendChild(li);
          });
          card.appendChild(ul);
        }

        if (ad.facts && ad.facts.length) {
          var dl = el("dl", "facts");
          ad.facts.forEach(function (f) {
            dl.appendChild(el("dt", null, f.k));
            dl.appendChild(el("dd", null, f.v));
          });
          card.appendChild(dl);
          if (ad.factsNote) card.appendChild(el("p", "facts-note", ad.factsNote));
        }

        if (ad.cta && ad.cta.url) {
          var cta = el("a", "cta", ad.cta.label || "자세히 보기");
          cta.href = ad.cta.url;
          cta.target = "_blank";          // 헬퍼 안에서는 기본 브라우저로 넘어간다
          cta.rel = "noopener";
          card.appendChild(cta);
          if (ad.code) {
            var affix = el("p", "affix");
            affix.appendChild(document.createTextNode("추천 코드 "));
            affix.appendChild(el("code", null, ad.code));
            affix.appendChild(document.createTextNode(" · 링크에 자동 적용"));
            card.appendChild(affix);
          }
        }

        var foot = el("footer", "ad-foot");
        if (ad.disclosure) foot.appendChild(el("p", null, ad.disclosure));
        if (ad.sources && ad.sources.length) {
          var p = el("p", null, "출처: ");
          ad.sources.forEach(function (s, i) {
            if (i) p.appendChild(document.createTextNode(" · "));
            var a = el("a", null, s.label);
            a.href = s.url; a.target = "_blank"; a.rel = "noopener";
            p.appendChild(a);
          });
          foot.appendChild(p);
        }
        card.appendChild(foot);
        root.appendChild(card);
      });
    })();
  </script>
</body>
</html>
